name: CI Pipeline

on:
  push:
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type Check
        run: bun run typecheck

      - name: Run Tests
        run: bun run test --run

      # Built on the Bun runtime, as in the Docker image.
      - name: Build
        run: bun --bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  security:
    name: Security (bun audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      # Production dependencies must be free of known high/critical advisories.
      - name: Audit production dependencies
        run: bun audit --prod --audit-level=high

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Image
        run: docker build -t cp-examseat-frontend:ci .

      - name: Validate Compose Files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config -q
